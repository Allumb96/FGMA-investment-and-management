<body>
<script src="dati.js"></script>
<style>
:root{
  color-scheme:dark;
  --nero:#070706; --ink:#f4ede4; --muted:#b9ada2;
  --brass:#c9a15a; --brass-d:#9b7d4e; --brass-l:#e9d6a2;
  --carta:#f3ecdd; --carta-ink:#272118; --argento:#cfd4d8;
  --serif:'Cormorant Garamond','Iowan Old Style',Palatino,Georgia,serif;
  --sans:'Instrument Sans',-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --caps:'Cinzel','Cormorant Garamond',Georgia,serif;
}
html,body{height:100%;background:var(--nero);color:var(--ink);overflow:hidden}
[hidden]{display:none!important}
body{margin:0;font-family:var(--sans);-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;background:var(--nero)}
#stage{position:absolute;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
video.clip{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:0;pointer-events:none;transition:opacity .34s ease}
video.clip.on{opacity:1}
img.fermo{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:0;pointer-events:none;
  transition:opacity .34s ease}
img.fermo.on{opacity:1}
.layer{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s}
.layer.on{opacity:1;visibility:visible;transition:opacity .6s ease}

/* ---------- intro ---------- */
#intro{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,#16130f 0%,#070706 70%);transition:opacity .9s ease}
#intro.via{opacity:0;pointer-events:none}
.intro-box{display:grid;justify-items:center;gap:22px;padding:24px;text-align:center}
.lockup{display:flex;align-items:flex-start;filter:drop-shadow(0 2px 16px rgba(0,0,0,.55))}
.lockup img{display:block;height:auto}
.lockup .ib{width:min(52vw,360px)}
.lockup .ma{width:min(11vw,74px)}
.lockup i{display:block;width:1px;height:min(14vw,92px);margin:4px min(3vw,20px) 0;background:linear-gradient(180deg,#fff,var(--brass-l) 55%,var(--brass));transform:rotate(32deg)}
.intro-nome{font-family:var(--caps);font-size:clamp(11px,1.5vw,14px);letter-spacing:.32em;color:var(--brass-l);text-transform:uppercase}
.carica{width:min(60vw,280px);height:1px;background:rgba(244,237,228,.14);position:relative;overflow:hidden}
.carica b{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--brass-d),var(--brass-l));transition:width .25s ease}
.btn-entra{font-family:var(--caps);font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--nero);background:linear-gradient(180deg,var(--brass-l),var(--brass));border:0;padding:14px 34px 13px 38px;border-radius:2px;cursor:pointer;box-shadow:0 10px 30px -10px rgba(201,161,90,.6);transition:transform .2s ease,opacity .3s}
.btn-entra:disabled{opacity:.35;cursor:wait}
.btn-entra:not(:disabled):hover{transform:translateY(-1px)}
.intro-nota{font-size:12px;color:var(--muted);letter-spacing:.04em}
#scorri{display:none}


/* ---------- HUD ---------- */
.hud{position:absolute;z-index:20;font-family:var(--caps);font-size:clamp(9px,1.05vw,12px);letter-spacing:.22em;text-transform:uppercase;border-radius:2px;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#salta{right:1.6%;bottom:3.6%;color:rgba(244,237,228,.7);background:rgba(7,7,6,.35);border:1px solid rgba(244,237,228,.22);padding:8px 14px 7px 16px}
#salta:hover{color:var(--ink);border-color:var(--brass)}
#esci{left:1.6%;bottom:11%;color:var(--brass-l);background:rgba(7,7,6,.5);border:1px solid rgba(201,161,90,.5);padding:9px 16px 8px 14px}
#ingresso{left:1.6%;top:3.4%;color:rgba(233,214,162,.75);background:rgba(7,7,6,.4);border:1px solid rgba(201,161,90,.32);padding:8px 14px 7px 16px}
#esci:hover,#ingresso:hover{background:rgba(7,7,6,.8);border-color:var(--brass-l);color:var(--brass-l)}
.hud[hidden]{display:none!important}
#err{position:absolute;inset:auto 0 0;z-index:50;display:none;padding:10px;background:#3a1210;color:#ffd9d4;font:12px/1.5 var(--sans);text-align:center}
#avviso{position:absolute;left:50%;bottom:11%;transform:translate(-50%,8px);z-index:21;opacity:0;pointer-events:none;
  font-family:var(--caps);font-size:clamp(10px,1.1vw,13px);letter-spacing:.22em;text-transform:uppercase;color:var(--brass-l);
  background:linear-gradient(180deg,rgba(14,12,10,.86),rgba(7,7,6,.86));border:1px solid rgba(201,161,90,.45);
  padding:10px 18px 9px 21px;border-radius:2px;white-space:nowrap;transition:opacity .6s ease,transform .6s ease;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#avviso.on{opacity:1;transform:translate(-50%,0)}

/* ---------- citofono ---------- */
.tasto{position:absolute;border-radius:50%;cursor:pointer;border:0;background:transparent;padding:0;outline:none}
.tasto::before{content:"";position:absolute;inset:-10%;border-radius:50%;box-shadow:0 0 18px 2px rgba(233,214,162,0);transition:box-shadow .3s ease}
.tasto::after{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,rgba(255,236,190,.55),rgba(255,236,190,0) 70%);opacity:0;transition:opacity .3s ease}
#lay-citofono.on .tasto::after{animation:respiro 2.8s ease-in-out infinite}
#t-clienti::after{animation-delay:1.4s!important}
.tasto:hover::before,.tasto:focus-visible::before{box-shadow:0 0 0 1px rgba(233,214,162,.85),0 0 22px 4px rgba(233,214,162,.45)}
.tasto:hover::after{opacity:1;animation:none}
.tasto.premuto{transform:scale(.92);transition:transform .12s ease}
@keyframes respiro{0%,100%{opacity:0}50%{opacity:.75}}
.etichetta-tasto{position:absolute;transform:translate(-100%,-50%);font-family:var(--caps);font-weight:600;letter-spacing:.24em;color:#d9c9a3;text-shadow:0 1px 0 rgba(0,0,0,.85);white-space:nowrap;pointer-events:none}

/* ---------- punti cliccabili su scrivania e sala ---------- */
.punto{position:absolute;cursor:pointer;border:0;padding:0;background:transparent;outline:none}
.punto .luce{position:absolute;inset:0;border-radius:4px;background:radial-gradient(70% 60% at 50% 50%,rgba(255,226,170,.2),rgba(255,226,170,0) 72%);box-shadow:inset 0 0 0 1px rgba(233,214,162,0);opacity:0;transition:opacity .35s ease,box-shadow .35s ease}
.punto .nome{position:absolute;left:50%;bottom:calc(100% + 9px);transform:translate(-50%,6px);opacity:0;transition:opacity .3s ease,transform .3s ease;white-space:nowrap;
  font-family:var(--caps);font-weight:600;font-size:clamp(9px,1.05vw,13px);letter-spacing:.22em;text-transform:uppercase;color:var(--brass-l);
  background:linear-gradient(180deg,rgba(18,16,13,.94),rgba(8,8,7,.94));border:1px solid rgba(201,161,90,.55);padding:6px 11px 5px 14px;border-radius:2px;box-shadow:0 10px 24px -10px rgba(0,0,0,.85)}
.punto .nome::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:9px;background:linear-gradient(var(--brass),transparent)}
.punto:hover .luce,.punto:focus-visible .luce{opacity:1;box-shadow:inset 0 0 0 1px rgba(233,214,162,.65),0 0 26px 6px rgba(233,214,162,.16)}
.punto:hover .nome,.punto:focus-visible .nome{opacity:1;transform:translate(-50%,0)}
.punto.basso .nome{bottom:auto;top:calc(100% + 9px)}
.punto.basso .nome::after{top:auto;bottom:100%;background:linear-gradient(transparent,var(--brass))}
.layer.on .punto .perla{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6df,var(--brass));box-shadow:0 0 12px 3px rgba(233,214,162,.5);animation:respiro 3.2s ease-in-out infinite}
.punto:hover .perla{opacity:0}
@media (hover:none){.punto .nome{opacity:.94;transform:translate(-50%,0);font-size:11px;padding:5px 9px 4px 11px}.punto .perla{display:none}}

/* ---------- superfici proiettate ---------- */
.surf{position:absolute;left:0;top:0;transform-origin:0 0;container-type:size;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .7s ease,visibility 0s linear .7s}
.surf.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .8s ease .1s}
.surf.aperta{transition:opacity .34s ease}
.surf *{box-sizing:border-box}
.surf.piana{overflow:visible;pointer-events:none}
.surf.glide{transition:opacity .34s ease,transform .46s cubic-bezier(.33,0,.1,1),
  left .46s cubic-bezier(.33,0,.1,1),top .46s cubic-bezier(.33,0,.1,1),width .46s cubic-bezier(.33,0,.1,1),
  height .46s cubic-bezier(.33,0,.1,1)}
.surf.aperta{transform:none!important;left:50%!important;top:calc(50% + 14px)!important;translate:-50% -50%;
  width:min(86%,1120px)!important;height:auto!important;aspect-ratio:1/var(--asp,.6);
  z-index:26;box-shadow:0 50px 140px -30px rgba(0,0,0,.85),0 0 0 1px rgba(201,161,90,.35)}
#velo{position:absolute;inset:0;z-index:24;background:rgba(6,6,5,.64);opacity:0;visibility:hidden;cursor:zoom-out;
  transition:opacity .45s ease,visibility 0s linear .45s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#velo.on{opacity:1;visibility:visible;transition:opacity .5s ease}
#esci{z-index:28}

/* ---------- varco dell'area clienti ---------- */
#varco{position:absolute;inset:0;z-index:25;display:grid;place-items:center;padding:clamp(16px,4vw,48px);
  background:radial-gradient(120% 100% at 50% 45%,rgba(7,7,6,.52),rgba(7,7,6,.82));
  opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#varco.on{opacity:1;visibility:visible;transition:opacity .7s ease}
.scheda-varco{width:min(92%,470px);display:grid;justify-items:center;gap:clamp(10px,1.8vh,18px);text-align:center;
  padding:clamp(20px,3.4vh,34px) clamp(18px,3vw,34px);border-radius:3px;
  background:linear-gradient(170deg,rgba(18,16,13,.94),rgba(8,8,7,.96));
  border:1px solid rgba(201,161,90,.42);box-shadow:0 40px 110px -30px rgba(0,0,0,.9);
  transform:translateY(10px);transition:transform .7s cubic-bezier(.2,.7,.2,1)}
#varco.on .scheda-varco{transform:translateY(0)}
#accesso{display:grid;gap:6px;width:min(100%,340px);text-align:left;margin-top:4px}
#accesso label{font-family:var(--caps);font-size:clamp(9px,.9vw,11px);letter-spacing:.22em;text-transform:uppercase;
  color:rgba(233,214,162,.72);margin-top:6px}
#accesso input{font-family:var(--sans);font-size:15px;color:var(--ink);background:rgba(244,237,228,.06);
  border:1px solid rgba(201,161,90,.32);border-radius:2px;padding:11px 12px;outline:none;
  transition:border-color .25s ease,background .25s ease;-webkit-appearance:none;appearance:none}
#accesso input:focus{border-color:var(--brass-l);background:rgba(244,237,228,.1)}
#accesso button{margin-top:14px}
#accesso button[disabled]{opacity:.55;cursor:progress}
.acc-err{margin:10px 0 0;font-family:var(--sans);font-size:12.5px;line-height:1.5;color:#e0a89a;text-align:center}
#varco-dentro{display:grid;justify-items:center;gap:14px}
.bentornato{margin:0;font-family:var(--sans);font-size:15px;color:rgba(244,237,228,.8)}
.bentornato b{font-family:var(--serif);font-size:19px;color:var(--brass-l);font-weight:600}
#t-esci{display:none;font-family:var(--caps);font-size:clamp(8.5px,.95vw,12px);letter-spacing:.2em;
  text-transform:uppercase;color:rgba(244,237,228,.6);background:transparent;border:0;cursor:pointer;
  padding:7px 8px 6px;transition:color .25s ease}
#t-esci:hover{color:var(--brass-l)}
#dash.dentro #t-esci{display:inline-block}
.scheda-varco .lockup .ib{width:min(46vw,170px)}
.scheda-varco .lockup .ma{width:min(10vw,36px)}
.scheda-varco .lockup i{height:min(13vw,44px);margin:2px min(2.4vw,10px) 0}
.scheda-varco .fil{width:72%;height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
.scheda-varco h2{font-family:var(--caps);font-weight:600;font-size:clamp(15px,2.3vh,21px);letter-spacing:.22em;
  text-transform:uppercase;color:var(--brass-l);margin:0}
.scheda-varco p{font-family:var(--serif);font-size:clamp(13px,1.9vh,17px);line-height:1.5;color:rgba(234,226,214,.84);margin:0;max-width:34em}
.scheda-varco button{font-family:var(--caps);font-size:clamp(11px,1.5vh,13px);letter-spacing:.3em;text-transform:uppercase;
  color:var(--nero);background:linear-gradient(180deg,var(--brass-l),var(--brass));border:0;border-radius:2px;
  padding:13px 32px 12px 36px;cursor:pointer;box-shadow:0 12px 32px -12px rgba(201,161,90,.7);
  transition:transform .2s ease,box-shadow .2s ease}
.scheda-varco button:hover{transform:translateY(-1px);box-shadow:0 16px 40px -12px rgba(201,161,90,.85)}
.scheda-varco small{font-family:var(--sans);font-size:clamp(10px,1.3vh,12px);letter-spacing:.06em;color:var(--muted)}
.surf.aperta .vetro{background:linear-gradient(126deg,rgba(16,22,26,.90),rgba(9,13,17,.94) 45%,rgba(20,27,32,.90));
  box-shadow:inset 0 0 0 1px rgba(226,240,245,.30)}
.surf.aperta .vetro::before{opacity:.5}
.surf.aperta .nov{background:linear-gradient(126deg,rgba(16,22,26,.90),rgba(10,14,18,.94))}

/* ---------- barra di navigazione ---------- */
#dash{position:absolute;left:0;right:0;top:0;z-index:29;display:flex;align-items:center;gap:clamp(8px,1.6vw,22px);
  padding:clamp(7px,1.1vh,13px) clamp(12px,2vw,26px);
  background:linear-gradient(180deg,rgba(7,7,6,.82),rgba(7,7,6,.34) 70%,rgba(7,7,6,0));
  opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
#dash.on{opacity:1;visibility:visible;transition:opacity .7s ease}
#dash .marchio{display:flex;align-items:flex-start;gap:clamp(5px,.8vw,10px);cursor:pointer;flex:0 0 auto}
#dash .marchio img{display:block;height:auto}
#dash .marchio .ib{width:clamp(74px,9vw,122px)}
#dash .marchio .ma{width:clamp(16px,1.9vw,26px)}
#dash .marchio i{display:block;width:1px;height:clamp(16px,2vw,26px);margin:2px clamp(4px,.6vw,8px) 0;
  background:linear-gradient(180deg,#fff,var(--brass-l) 60%,var(--brass))}
#dash nav{margin-left:auto;display:flex;align-items:center;gap:clamp(3px,.9vw,14px);flex-wrap:nowrap;overflow:hidden;padding-left:12px}
#dash button{font-family:var(--caps);font-size:clamp(8.5px,.95vw,12px);letter-spacing:.2em;text-transform:uppercase;
  color:rgba(244,237,228,.68);background:transparent;border:0;border-radius:2px;cursor:pointer;white-space:nowrap;
  padding:7px clamp(5px,.8vw,11px) 6px;transition:color .25s ease,background .25s ease}
#dash button:hover,#dash button:focus-visible{color:var(--brass-l);background:rgba(201,161,90,.12)}
#dash button.qui{color:var(--brass-l);box-shadow:inset 0 -1px 0 var(--brass)}
#dash .riservata{color:var(--brass-l);border:1px solid rgba(201,161,90,.5)}
#dash .riservata:hover{background:rgba(201,161,90,.2)}
#dash .audio{flex:0 0 auto;width:30px;height:30px;margin-left:6px;display:grid;place-items:center;
  background:transparent;border:1px solid rgba(201,161,90,.35);border-radius:50%;cursor:pointer;
  transition:border-color .25s ease,background .25s ease}
#dash .audio:hover{background:rgba(201,161,90,.14);border-color:rgba(201,161,90,.6)}
#dash .audio .onde{display:block;width:13px;height:13px;background:var(--brass-l);
  -webkit-mask:var(--ico) center/contain no-repeat;mask:var(--ico) center/contain no-repeat;
  --ico:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 9h4l5-4v14l-5-4H4z'/><path d='M16.5 8.5a5 5 0 0 1 0 7' fill='none' stroke='black' stroke-width='2'/><path d='M19 6a8.5 8.5 0 0 1 0 12' fill='none' stroke='black' stroke-width='2'/></svg>")}
#dash .audio.muto{border-color:rgba(244,237,228,.22)}
#dash .audio.muto .onde{background:rgba(244,237,228,.38);
  --ico:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 9h4l5-4v14l-5-4H4z'/><path d='M16 9l6 6M22 9l-6 6' fill='none' stroke='black' stroke-width='2'/></svg>")}
@media (max-width:720px){ #dash nav button span{display:none} }
/* anteprime: il contenuto si vede gia' sull'oggetto, prima di cliccarlo */
.surf.ant{pointer-events:none}
.surf.ant .azioni,.surf.ant .copia,.surf.ant .sfoglia,.surf.ant .giu-ind,.surf.ant .suggerimento,
.surf.ant .pallini,.surf.ant .avvicina,.surf.ant .conta,.surf.ant .pie,
.surf.ant .pie2,.surf.ant .guida,.surf.ant .copia{display:none!important}
.surf.ant .cont .dx,.surf.ant .bigl .team,.surf.ant .bigl .trio{display:none!important}
.surf.ant{filter:saturate(.9) contrast(.96)}
.surf.ant.on{opacity:.93}
.surf.ant::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.22));pointer-events:none}

/* targhetta del citofono */
.targa-ing{width:100%;height:100%;display:grid;place-items:center;align-content:center;gap:5cqh;padding:8cqw;
  background:radial-gradient(120% 90% at 30% 20%,#2a2722 0%,#121110 55%,#090908 100%);
  box-shadow:inset 0 0 0 1.2cqw #b8955a,inset 0 0 0 1.8cqw #3a2e1c,inset 0 0 6cqw rgba(0,0,0,.8)}
.targa-ing .lockup .ib{width:56cqw}.targa-ing .lockup .ma{width:12cqw}
.targa-ing .lockup i{height:15cqw;margin:.6cqw 3cqw 0}
.targa-ing .riga{width:62cqw;height:1px;background:linear-gradient(90deg,transparent,#c9a15a,transparent)}
.targa-ing .t{font-family:var(--caps);font-weight:600;color:#e3cf9c;letter-spacing:.2em;text-align:center;font-size:6.2cqw;line-height:1.35;text-shadow:0 1px 0 #000}
.targa-ing .t small{display:block;font-size:4.2cqw;letter-spacing:.3em;color:#bfa77a}

/* ---------- biglietto da visita (chi siamo) ---------- */
.bigl{position:absolute;inset:0;perspective:160cqw}
.bigl .mazzo{position:absolute;inset:0;transform-style:preserve-3d}
.faccia{position:absolute;inset:0;background:linear-gradient(158deg,#fdf8ee 0%,#f0e7d4 48%,#e6dbc4 100%);color:#241d14;
  padding:7cqw 8cqw;display:flex;flex-direction:column;justify-content:center;gap:2.6cqh;
  box-shadow:0 1.4cqw 3cqw -1cqw rgba(0,0,0,.6),inset 0 0 0 .35cqw rgba(201,161,90,.5);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.3,.05,.2,1),opacity .4s ease}
.faccia::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.5) 0 18%,rgba(255,255,255,0) 42%)}
.faccia.via{transform:rotateY(-180deg) translateZ(1cqw);opacity:0}
.faccia.poi{transform:rotateY(180deg);opacity:0}
.bigl .fronte{align-items:center;text-align:center;justify-content:center;gap:3cqh}
.bigl .fronte .lockup .ib{width:40cqw}.bigl .fronte .lockup .ma{width:8.6cqw}
.bigl .fronte .lockup i{height:10.5cqw;margin:.4cqw 2.2cqw 0;background:linear-gradient(180deg,#6b5a3b,#b8955a)}

/* ---------- schermo del portatile: chi siamo, si scorre ---------- */

.pcs .motto{font-family:var(--serif);font-size:3cqh;line-height:1.45;color:#f2f7f9}
.pcs .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw}
.pcs .trio>div{padding:2.2cqh 1.8cqw;background:rgba(226,240,245,.05);border:1px solid rgba(190,205,215,.12)}
.pcs .trio b{display:block;font-family:var(--caps);font-size:1.7cqh;letter-spacing:.14em;color:var(--brass-l);margin-bottom:1cqh}
.pcs .trio span{font-family:var(--sans);font-size:1.85cqh;line-height:1.5;color:rgba(230,238,242,.78)}
.pcs .team{display:flex;flex-direction:column;gap:2cqh}
.pcs .team>div{display:flex;align-items:center;gap:2cqw}
.pcs .team i{flex:0 0 auto;width:5cqh;height:5cqh;border-radius:50%;display:grid;place-items:center;font-style:normal;

.pcs .asta{position:absolute;right:.2cqw;top:0;bottom:0;width:.4cqh;border-radius:99px;background:rgba(190,205,215,.1)}

/* ---------- biglietto dei contatti: carta bianca, si gira ---------- */
.card2{position:absolute;inset:0;perspective:160cqw;background:transparent}

.f2 .fil{height:1px;margin:3cqh 0;background:linear-gradient(90deg,#c9a15a,rgba(140,115,70,.18))}
.f2 dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2cqh 3cqw;align-items:baseline}
.f2 dt{font-family:var(--caps);font-size:1.7cqh;letter-spacing:.24em;text-transform:uppercase;color:#8d6d3b}
.f2 dd{margin:0;font-family:var(--serif);font-size:3.4cqh;line-height:1.2;color:#15120d}
.f2 dd .ruolo{font-family:var(--sans);font-size:2cqh;color:#5e5543}

  font-size:1.6cqh;letter-spacing:.26em;text-transform:uppercase;color:#8d6d3b}

.card2 .pie2{position:absolute;right:5.6cqw;bottom:2.4cqh;z-index:4;font-family:var(--caps);font-size:1.6cqh;
  letter-spacing:.24em;text-transform:uppercase;color:#8d6d3b;pointer-events:none}

/* ---------- lavagna in vetro (metodo) ---------- */
.vetro{position:absolute;inset:0;padding:5.5cqh 4cqw;display:grid;grid-template-columns:38% 1fr;grid-template-rows:auto 1fr;gap:3.4cqw;
  background:linear-gradient(126deg,rgba(18,26,30,.26),rgba(10,16,20,.16) 40%,rgba(30,40,46,.24));
  box-shadow:inset 0 0 0 .22cqw rgba(226,240,245,.45);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.vetro::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(104deg,rgba(255,255,255,.14) 0 9%,rgba(255,255,255,0) 26% 72%,rgba(255,255,255,.09) 94% 100%)}
.vetro .intesta{grid-column:1/-1;display:flex;align-items:baseline;gap:2.4cqw;border-bottom:1px solid rgba(226,240,245,.3);padding-bottom:2.2cqh;margin-bottom:.6cqh}
.vetro h2{font-family:var(--caps);font-weight:600;font-size:4.2cqh;letter-spacing:.14em;margin:0;color:#f2f8fa;text-shadow:0 0 2cqh rgba(190,225,235,.45)}
.vetro .intesta small{font-family:var(--sans);font-size:1.6cqh;letter-spacing:.26em;text-transform:uppercase;color:rgba(226,240,245,.6);margin-left:auto}
.rail{display:flex;flex-direction:column;gap:1.1cqh;position:relative}
.rail::before{content:"";position:absolute;left:2.3cqh;top:1.4cqh;bottom:1.4cqh;width:1px;background:linear-gradient(rgba(226,240,245,.1),rgba(226,240,245,.45),rgba(226,240,245,.1))}
.voce{position:relative;display:flex;gap:2cqh;align-items:center;text-align:left;background:transparent;border:0;cursor:pointer;
  padding:1.9cqh 1.6cqh;border-radius:.6cqh;color:rgba(238,248,250,.72);font-family:var(--sans);font-size:2.6cqh;letter-spacing:.02em;transition:color .3s,background .3s}
.voce i{flex:0 0 auto;width:3.2cqh;height:3.2cqh;border-radius:50%;background:rgba(10,20,24,.7);border:1px solid rgba(226,240,245,.5);display:grid;place-items:center;
  font-style:normal;font-family:var(--caps);font-size:1.9cqh;color:rgba(238,248,250,.8);transition:all .35s;z-index:1}
.voce b{font-weight:500}
.voce:hover{color:#fff;background:rgba(226,240,245,.06)}
.voce.on{color:#fff;background:linear-gradient(90deg,rgba(226,240,245,.12),rgba(226,240,245,.02))}
.voce.on i{background:linear-gradient(180deg,var(--brass-l),var(--brass));border-color:var(--brass-l);color:#1a1409;box-shadow:0 0 2.4cqh rgba(233,214,162,.55)}
.spiega{position:relative;padding:1.6cqh 0 0 3cqw;border-left:1px solid rgba(226,240,245,.22);display:flex;flex-direction:column;gap:2.2cqh}
.spiega .t{font-family:var(--serif);font-size:4.8cqh;line-height:1.1;color:#f6fbfc;font-weight:600}
.spiega .d{font-family:var(--sans);font-size:2.6cqh;line-height:1.55;color:rgba(234,244,246,.84);max-width:34em}
.spiega .d span{opacity:0;filter:blur(3px);transition:opacity .4s ease,filter .4s ease}
.spiega .d span.vis{opacity:1;filter:none}
.spiega .barra{margin-top:auto;display:flex;align-items:center;gap:1.4cqw;font-family:var(--caps);font-size:1.5cqh;letter-spacing:.2em;color:rgba(226,240,245,.55)}
.spiega .barra em{flex:1;height:1px;background:linear-gradient(90deg,var(--brass),rgba(226,240,245,.12))}
.suggerimento{position:absolute;left:4cqw;bottom:2.4cqh;font-family:var(--caps);font-size:1.5cqh;letter-spacing:.24em;text-transform:uppercase;color:rgba(226,240,245,.45);transition:opacity .4s}
.vetro.toccata .suggerimento{opacity:0}
/* la lavagna in vetro appoggiata alla parete: formato verticale */
.vetro.vert{display:flex;flex-direction:column;gap:3.4cqh;padding:7cqh 8cqw;
  background:linear-gradient(160deg,rgba(18,26,30,.22),rgba(10,16,20,.13) 42%,rgba(30,40,46,.20))}
.vetro.vert .intesta{display:block;border-bottom:1px solid rgba(226,240,245,.28);padding-bottom:2.2cqh;margin:0}
.vetro.vert h2{font-size:3.1cqh;line-height:1.3;letter-spacing:.1em}
.vetro.vert .intesta small{display:block;margin:1.2cqh 0 0;font-size:1.25cqh;letter-spacing:.3em}
.vetro.vert .passi{display:flex;flex-direction:column;gap:3.2cqh}
.vetro.vert .pz{display:grid;grid-template-columns:auto 1fr;gap:3cqw;align-items:start}
.vetro.vert .pz i{width:3.4cqh;height:3.4cqh;border-radius:50%;display:grid;place-items:center;font-style:normal;
  font-family:var(--caps);font-size:1.5cqh;color:rgba(238,248,250,.85);background:rgba(10,20,24,.55);
  border:1px solid rgba(226,240,245,.45)}
.vetro.vert .pz h4{margin:0 0 .8cqh;font-family:var(--serif);font-weight:600;font-size:2.3cqh;line-height:1.2;color:#f6fbfc}
.vetro.vert .pz p{margin:0;font-family:var(--sans);font-size:1.6cqh;line-height:1.5;color:rgba(234,244,246,.76)}
.vetro.vert .pie{margin-top:auto;display:flex;align-items:center;gap:2cqw;font-family:var(--caps);
  font-size:1.25cqh;letter-spacing:.26em;color:rgba(226,240,245,.5)}
.vetro.vert .pie em{flex:1;height:1px;background:linear-gradient(90deg,var(--brass),rgba(226,240,245,.1))}
.surf.ant .vetro.vert .pie{display:flex!important}

/* ---------- contratti pinzati (termini) ---------- */
.pinz{position:absolute;inset:0;perspective:150cqw;background:#2a2318}
.pinz .pila{position:absolute;inset:0;transform-style:preserve-3d}
.pinz .graffa{position:absolute;left:50%;top:1.4cqh;transform:translateX(-50%);width:11cqw;height:1.6cqh;z-index:9;
  background:linear-gradient(180deg,#e8e4da,#8d8b84 60%,#5e5c57);border-radius:.3cqh;box-shadow:0 .5cqh 1cqh -.3cqh rgba(0,0,0,.6)}
.scheda{position:absolute;inset:0;background:linear-gradient(176deg,#fdf9ef,#f0e9d8 60%,#e7dfcb);color:var(--carta-ink);

  font-family:var(--caps);font-size:2.6cqh;letter-spacing:.22em;text-transform:uppercase;color:#8d6d3b}
.scheda .num{font-family:var(--serif);font-size:11cqh;line-height:.8;color:rgba(141,109,59,.34);font-weight:700}
.scheda h3{font-family:var(--serif);font-weight:600;font-size:7cqh;line-height:1.05;margin:0;color:#1f1912;text-wrap:balance}
.scheda p{font-family:var(--serif);font-size:3.9cqh;line-height:1.45;margin:0;color:#3a3225}
.scheda .intro p{font-size:4.4cqh}
.scheda .vigore{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;
  font-family:var(--caps);font-size:2.4cqh;letter-spacing:.2em;color:#7d6a4c;border-top:1px solid rgba(140,115,70,.3);padding-top:1.6cqh}
.scheda .timbro{font-family:var(--caps);font-size:2.5cqh;line-height:1.15;text-align:center;color:rgba(150,60,50,.6);
  border:1.5px solid rgba(150,60,50,.45);border-radius:50%;width:15cqh;height:15cqh;display:grid;place-items:center;transform:rotate(-13deg)}
.pinz .sfoglia{position:absolute;left:50%;bottom:2cqh;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:1.6cqw;
  font-family:var(--caps);font-size:2.3cqh;letter-spacing:.22em;text-transform:uppercase;color:#8d6d3b;pointer-events:none;transition:opacity .4s}
.pinz.toccata .sfoglia{opacity:0}
.pinz .su,.pinz .giu{position:absolute;z-index:11;left:0;right:0;height:46%;background:transparent;border:0;cursor:pointer}
.pinz .su{top:0;cursor:n-resize}.pinz .giu{bottom:0;cursor:s-resize}
.pinz .conta{position:absolute;right:3cqw;bottom:2.2cqh;z-index:10;font-family:var(--caps);font-size:2.3cqh;letter-spacing:.18em;color:#8d6d3b;pointer-events:none}

/* ---------- tablet a scorrimento (come funziona) ---------- */
.tab{position:absolute;inset:0;background:#0b0d0e;display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 .5cqh #15181a,inset 0 0 4cqh rgba(0,0,0,.8)}

  font-family:var(--sans);font-size:1.6cqh;color:rgba(244,237,228,.55);letter-spacing:.06em}
.tab .stato i{font-family:var(--caps);font-style:normal;letter-spacing:.3em;color:var(--brass-l)}
.tab .finestra{position:relative;flex:1;overflow:hidden;cursor:grab}
.tab .finestra.tira{cursor:grabbing}
.tab .pista{position:absolute;left:0;right:0;top:0;padding:1cqh 3.4cqw 6cqh;display:flex;flex-direction:column;gap:2.6cqh;transition:transform .5s cubic-bezier(.2,.7,.2,1)}

.passo{display:grid;grid-template-columns:7.5cqh 1fr;gap:2.6cqw;align-items:start;padding:2.4cqh 0;border-top:1px solid rgba(201,161,90,.22)}

.passo h3{font-family:var(--serif);font-weight:600;font-size:3.5cqh;line-height:1.1;margin:0 0 1.2cqh;color:#fbf6ec}

function cablaAccesso(){
  const f=$('#accesso'), err=$('#acc-err'), btn=$('#varco-entra');
  if (f) f.addEventListener('submit', async e=>{
    e.preventDefault();
    if (!btn || btn.disabled) return;
    const etichetta=btn.textContent;
    err.hidden=true; btn.disabled=true; btn.textContent='Verifica…';
    try{
      if (!window.API) throw new Error('modulo dati non caricato');
      const r = await API.login($('#acc-user').value, $('#acc-pw').value);
      if (!r || !r.ok){
        err.textContent = (r && r.errore) || 'Nome utente o password non corretti.';
        err.hidden=false; return;
      }
      applicaDati(await API.me());
      entrato=true; segnaAccesso();
      $('#acc-pw').value=''; $('#acc-user').value='';
      apriPorta();
    }catch(ex){
      err.textContent='Accesso non riuscito. Riprova tra un momento.'; err.hidden=false;
    }finally{ btn.disabled=false; btn.textContent=etichetta; }
  });
  const apri2=$('#varco-apri');
  if (apri2) apri2.addEventListener('click', apriPorta);
  const esc=$('#t-esci');
  if (esc) esc.addEventListener('click', async ()=>{
    try{ await API.logout(); }catch(e){}
    entrato=false; svuotaDati(); segnaAccesso();
    if (stato==='sala' || stato==='porta' || stato==='oggetto') vai('home');
    avviso('Sei uscito dall\'area riservata');
  });
  segnaAccesso();
}

(()=>{

  const attivo=()=> RITRATTO && stato!=='oggetto' && stato!=='intro' && SW>innerWidth;
  stage.addEventListener('pointerdown', e=>{
    if (!attivo() || e.target.closest('.surf.aperta,#dash,.hud,#varco')) return;
    x0=e.clientX; l0=parseFloat(stage.style.left)||0; mosso=false;
    stage.style.transition='none';
  });
  addEventListener('pointermove', e=>{
    if (x0===null) return;
    const dx=e.clientX-x0;
    if (Math.abs(dx)>7 && !mosso){ mosso=true; giaScorso=true; mostraScorri(false); }
    const l=Math.min(0, Math.max(innerWidth-SW, l0+dx));
    stage.style.left=l+'px'; fuocoX=(innerWidth/2 - l)/SW;
  }, {passive:true});
  const lascia=()=>{ if (x0===null) return; x0=null; stage.style.transition=''; };
  addEventListener('pointerup', lascia); addEventListener('pointercancel', lascia);
  stage.addEventListener('click', e=>{
    if (mosso){ mosso=false; e.stopPropagation(); e.preventDefault(); }
  }, true);
})();

/* ====================== geometria ====================== */
let SW=1280, SH=720;
let RITRATTO=false, fuocoX=.5;
function adatta(){
  const W=innerWidth, H=innerHeight, r=16/9;
  RITRATTO = (H > W) && W <= 820;
  let w,h,t;
  if (RITRATTO){ h=H*1.07; w=h*r; t=Math.min(0, Math.max(H-h, H/2 - h*.565)); }
  else { w=W; h=W/r; if (h>H){ h=H; w=H*r; } t=(H-h)/2; }
  SW=w; SH=h;
  Object.assign(stage.style,{width:w+'px',height:h+'px',top:t+'px'});
  if (RITRATTO) inquadra(fuocoX, true);
  else stage.style.left=((W-w)/2)+'px';
  piazzaTutto();
}
/* porta al centro dello schermo il punto fx (0..1) del fotogramma */
function inquadra(fx, subito){
  fuocoX = Math.max(0, Math.min(1, fx));
  if (!RITRATTO) return;
  const l = Math.min(0, Math.max(innerWidth - SW, innerWidth/2 - fuocoX*SW));
  if (subito){ stage.style.transition='none'; stage.style.left=l+'px';
    requestAnimationFrame(()=>{ stage.style.transition=''; }); }
  else { stage.style.transition=''; stage.style.left=l+'px'; }
}
let giaScorso=false;
function mostraScorri(si){
  const e=$('#scorri'); if(!e) return;
  const mostra = si && RITRATTO && !giaScorso && SW>innerWidth+8;
  e.hidden=false; e.classList.toggle('on', !!mostra);
}
function centroX(id){
  const q=((COORD&&COORD.superfici)||{})[id];
  return q ? q.reduce((a,p)=>a+p[0],0)/q.length : .5;
}
const px = p => [p[0]*SW, p[1]*SH];
function omografia(w,h,q){
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]] = q;
  const dx1=x1-x2, dx2=x3-x2, dx3=x0-x1+x2-x3, dy1=y1-y2, dy2=y3-y2, dy3=y0-y1+y2-y3;
  let a,b,c,d,e,f,g,hh;
  if (Math.abs(dx3)<1e-9 && Math.abs(dy3)<1e-9){ a=x1-x0;b=x3-x0;c=x0;d=y1-y0;e=y3-y0;f=y0;g=0;hh=0; }
  else {
    const den=dx1*dy2-dx2*dy1;
    g=(dx3*dy2-dx2*dy3)/den; hh=(dx1*dy3-dx3*dy1)/den;
    a=x1-x0+g*x1; b=x3-x0+hh*x3; c=x0; d=y1-y0+g*y1; e=y3-y0+hh*y3; f=y0;
  }
  a/=w; d/=w; g/=w; b/=h; e/=h; hh/=h;
  return `matrix3d(${a},${d},0,${g},${b},${e},0,${hh},0,0,1,0,${c},${f},0,1)`;
}
/* i punti arrivano da Blender in ordine BL, BR, TR, TL */
function piazza(el, punti, aspetto){
  if (!el || !punti) return;
  const [bl,br,tr,tl] = punti.map(px);
  const w = Math.max(Math.hypot(tr[0]-tl[0],tr[1]-tl[1]), Math.hypot(br[0]-bl[0],br[1]-bl[1]));
  const h = w*aspetto;
  el.style.width=w+'px'; el.style.height=h+'px';
  el.style.transform = omografia(w,h,[tl,tr,br,bl]);
}
function rett(pts){
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
}
/* un punto cliccabile non deve mai essere piu' piccolo di cosi', o non si becca col dito */
function minimo(r, lw=0.055, lh=0.05){
  const cx=(r[0]+r[2])/2, cy=(r[1]+r[3])/2;
  const w=Math.max(r[2]-r[0], lw)/2, h=Math.max(r[3]-r[1], lh)/2;
  return [cx-w, cy-h, cx+w, cy+h];
}
function inPerc(el,r,pad=0){
  el.style.left=(r[0]-pad)*100+'%'; el.style.top=(r[1]-pad)*100+'%';
  el.style.width=(r[2]-r[0]+2*pad)*100+'%'; el.style.height=(r[3]-r[1]+2*pad)*100+'%';
}

async function precarica(){

/* ====================== suono ====================== */
const AUDIO = (()=>{
  let AC=null, master=null, busM=null, busS=null, rev=null, noto=null;
  let acceso=true, musicaViva=false, ambiVivo=null, ambiNodi=null, tContare=null;
  try{ acceso = localStorage.getItem('fgma-audio') !== 'no'; }catch(e){}

  const ok = ()=> !!AC;
  const ora = ()=> AC ? AC.currentTime : 0;

  function bufRumore(sec){
    const n=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
    let ultimo=0;
    for(let i=0;i<n;i++){ const bianco=Math.random()*2-1; ultimo=(ultimo+0.02*bianco)/1.02; d[i]=bianco*0.7+ultimo*3; }
    return b;
  }
  function bufRiverbero(sec, caduta){
    const n=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(2,n,AC.sampleRate);
    for(let c=0;c<2;c++){ const d=b.getChannelData(c);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n, caduta); }
    return b;
  }
  function avvia(){
    if (AC){ try{ AC.resume&&AC.resume(); }catch(e){} return AC; }
    try{
      AC = new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain(); master.gain.value = acceso?1:0;
      const comp=AC.createDynamicsCompressor();
      comp.threshold.value=-16; comp.ratio.value=4; comp.attack.value=.005; comp.release.value=.28;
      master.connect(comp); comp.connect(AC.destination);
      busM=AC.createGain(); busM.gain.value=0; busM.connect(master);
      busS=AC.createGain(); busS.gain.value=.9; busS.connect(master);
      rev=AC.createConvolver(); rev.buffer=bufRiverbero(2.2,2.6);
      const rg=AC.createGain(); rg.gain.value=.45; rev.connect(rg); rg.connect(master);
      noto=bufRumore(2.5);
    }catch(e){ AC=null; }
    return AC;
  }
  function rumore(t, dur){
    const s=AC.createBufferSource(); s.buffer=noto; s.loop=true;
    s.playbackRate.value=.8+Math.random()*.4; s.start(t); s.stop(t+dur+.05); return s;
  }
  /* colpo: breve botta di rumore filtrato */
  function colpo(t,{f=1000,q=1,dur=.1,vol=.1,tipo='bandpass',bus=null}={}){
    if(!ok()) return;
    const n=rumore(t,dur), fl=AC.createBiquadFilter(), g=AC.createGain();
    fl.type=tipo; fl.frequency.value=f; fl.Q.value=q;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.006);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(fl); fl.connect(g); g.connect(bus||busS);
  }
  /* tono: oscillatore con inviluppo */
  function tono(t,{f=440,f2=null,dur=.4,vol=.1,tipo='sine',att=.006,riv=0}={}){
    if(!ok()) return;
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=tipo; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+att);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(busS);
    if(riv){ const rg=AC.createGain(); rg.gain.value=riv; g.connect(rg); rg.connect(rev); }
    o.start(t); o.stop(t+dur+.05);
  }

  /* ---------- l'auto che arriva ---------- */
  function arrivoAuto(){
    if(!ok()) return; const t=ora()+.05;
    const g=AC.createGain(); g.connect(busS);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.08,t+1.1);
    g.gain.exponentialRampToValueAtTime(.34,t+2.8);
    g.gain.exponentialRampToValueAtTime(.14,t+3.7);
    g.gain.exponentialRampToValueAtTime(.0001,t+4.9);
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=1.1;
    lp.frequency.setValueAtTime(260,t);
    lp.frequency.linearRampToValueAtTime(1600,t+2.8);
    lp.frequency.linearRampToValueAtTime(420,t+4.6);
    lp.connect(g);
    [1,1.5,2,3].forEach((m,i)=>{
      const o=AC.createOscillator(), og=AC.createGain();
      o.type = i?'sawtooth':'square'; og.gain.value=.42/(i+1);
      o.frequency.setValueAtTime(40*m,t);
      o.frequency.linearRampToValueAtTime(76*m,t+2.1);
      o.frequency.linearRampToValueAtTime(54*m,t+2.5);
      o.frequency.linearRampToValueAtTime(68*m,t+3.1);
      o.frequency.linearRampToValueAtTime(26*m,t+4.7);
      o.connect(og); og.connect(lp); o.start(t); o.stop(t+5);
    });
    const n=rumore(t,5), nf=AC.createBiquadFilter(), ng=AC.createGain();
    nf.type='bandpass'; nf.frequency.value=170; nf.Q.value=.6; ng.gain.value=.3;
    n.connect(nf); nf.connect(ng); ng.connect(g);
    gomme(t+3.15);                                  /* frenata sul selciato */
    colpo(t+4.9,{f:150,q:.8,dur:.22,vol:.16,tipo:'lowpass'});   /* portiera */
    colpo(t+4.93,{f:2600,q:3,dur:.05,vol:.05});
    for(let i=0;i<5;i++) passo(t+5.9+i*.62, .8+Math.random()*.3);  /* verso la porta */
  }
  function gomme(t){
    if(!ok()) return;
    const n=rumore(t,1.1), bp=AC.createBiquadFilter(), g=AC.createGain();
    bp.type='bandpass'; bp.Q.value=.8;
    bp.frequency.setValueAtTime(2400,t); bp.frequency.exponentialRampToValueAtTime(520,t+.95);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.20,t+.07);
    g.gain.exponentialRampToValueAtTime(.0001,t+1.0);
    n.connect(bp); bp.connect(g); g.connect(busS);

  }
  function passo(t,forza=1){
    colpo(t,{f:170,q:1.1,dur:.13,vol:.085*forza,tipo:'lowpass'});

  }
  function passi(t0,quanti,ritmo){ for(let i=0;i<quanti;i++) passo(t0+i*ritmo+Math.random()*.04,.8+Math.random()*.35); }

  /* ---------- conta banconote ---------- */
  function contaSoldi(vol=1,dur=1.5){
    if(!ok()) return; const t=ora()+.03;

  /* ---------- campanello ---------- */
  function campanello(){
    if(!ok()) return; const t=ora()+.02;
    [[659.25,0],[523.25,.42]].forEach(([f,dt])=>{
      tono(t+dt,{f, dur:1.5, vol:.2, tipo:'sine', riv:.5});

  }

  /* ---------- porta ---------- */
  function porta(){
    if(!ok()) return; const t=ora()+.02;
    colpo(t,{f:2800,q:4,dur:.05,vol:.09});                       /* scatto */
    const n=rumore(t+.1,1.1), fl=AC.createBiquadFilter(), g=AC.createGain();
    fl.type='bandpass'; fl.Q.value=4;

    g.gain.setValueAtTime(.0001,t+.1); g.gain.exponentialRampToValueAtTime(.05,t+.3);
    g.gain.exponentialRampToValueAtTime(.0001,t+1.15);
    n.connect(fl); fl.connect(g); g.connect(busS);
  }

  /* ---------- un suono per ogni oggetto ---------- */
  const OGG={
    'chi-siamo':   t=>{ tono(t,{f:520,dur:.16,vol:.05,tipo:'sine'}); tono(t+.07,{f:780,dur:.3,vol:.045,tipo:'sine',riv:.3});
                        colpo(t,{f:3400,q:3,dur:.04,vol:.03}); },
    'come-funziona':t=>{ colpo(t,{f:2600,q:4,dur:.05,vol:.07}); tono(t,{f:1500,dur:.22,vol:.05,tipo:'sine',riv:.35}); },
    'metodo':      t=>{ tono(t,{f:1180,dur:1.1,vol:.07,tipo:'triangle',riv:.6}); tono(t+.004,{f:2360,dur:.5,vol:.02,tipo:'sine',riv:.4}); },

    'termini':     t=>{ for(let i=0;i<5;i++) colpo(t+i*.055+Math.random()*.02,{f:3600+Math.random()*1800,q:1.4,dur:.09,vol:.045}); },

    'contatti':    t=>{ colpo(t,{f:5200,q:1.1,dur:.11,vol:.06}); colpo(t+.05,{f:2200,q:2,dur:.07,vol:.03}); },
    'schermo':     t=>{ colpo(t,{f:110,q:.8,dur:.3,vol:.11,tipo:'lowpass'}); tono(t+.05,{f:2400,f2:900,dur:.6,vol:.016,tipo:'sine'}); },

  function girata(){ if(!ok()) return; colpo(ora()+.02,{f:4200,q:1.2,dur:.12,vol:.05}); }

  /* ---------- ambiente ---------- */
  const AMBI={ fuori:{f:430,v:.055,q:.6}, scrivania:{f:240,v:.03,q:.5}, sala:{f:200,v:.026,q:.5} };
  function ambiente(tipo){
    if(!ok() || ambiVivo===tipo) return;
    ambiVivo=tipo;
    if (ambiNodi){ const g=ambiNodi.g, t=ora();
      g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(.0001,g.gain.value),t);
      g.gain.exponentialRampToValueAtTime(.0001,t+1.2);
      const vecchia=ambiNodi.n; setTimeout(()=>{ try{ vecchia.stop(); }catch(e){} },1500);
      ambiNodi=null;
    }
    const c=AMBI[tipo]; if(!c) return;
    const t=ora(), n=AC.createBufferSource(); n.buffer=noto; n.loop=true; n.playbackRate.value=.35;
    const fl=AC.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=c.f; fl.Q.value=c.q;
    const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(c.v,t+2.2);
    const lfo=AC.createOscillator(), lg=AC.createGain();
    lfo.type='sine'; lfo.frequency.value=.07; lg.gain.value=c.f*.35;
    lfo.connect(lg); lg.connect(fl.frequency); lfo.start(t);
    n.connect(fl); fl.connect(g); g.connect(master); n.start(t);
    ambiNodi={n,g};
  }

  /* ---------- musica di sottofondo: il brano della villa ---------- */
  let elBrano=null, branoPronto=false, branoPartito=false;
  function preparaBrano(){
    if (branoPronto || !ok()) return;
    const el=document.getElementById('brano'); if(!el) return;
    try{
      el.loop=true; el.volume=1;
      const src=AC.createMediaElementSource(el);
      const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=11000;
      src.connect(lp); lp.connect(busM);
      elBrano=el; branoPronto=true;
      const pr=el.play(); if(pr&&pr.catch) pr.catch(()=>{});
    }catch(e){}
  }
  function musica(si){
    if(!ok()) return;
    preparaBrano();
    if (elBrano && elBrano.paused){ const pr=elBrano.play(); if(pr&&pr.catch) pr.catch(()=>{}); }
    const t=ora(); busM.gain.cancelScheduledValues(t);
    busM.gain.setValueAtTime(Math.max(.0001,busM.gain.value),t);
    if (si && !musicaViva){ musicaViva=true;
      if (!branoPartito){ branoPartito=true; try{ elBrano.currentTime=0; }catch(e){} }
      busM.gain.exponentialRampToValueAtTime(.136,t+3.5); }
    else if (!si && musicaViva){ musicaViva=false; busM.gain.exponentialRampToValueAtTime(.0001,t+1.6); }
  }
  function abbassaMusica(giu){
    if(!ok()||!musicaViva) return;
    const t=ora(); busM.gain.cancelScheduledValues(t);
    busM.gain.setValueAtTime(Math.max(.0001,busM.gain.value),t);
    busM.gain.exponentialRampToValueAtTime(giu?.05:.136, t+(giu?.5:1.6));
  }

  /* ---------- suoni legati alle clip ---------- */
  const CLIPSUONO={
    A: ()=>{ arrivoAuto(); ambiente('fuori'); },
    B: ()=>{ ambiente('scrivania'); passi(ora()+.25,6,.62); },
    C0:()=>{ ambiente('sala'); passi(ora()+.2,6,.6); },
    C1:()=>{ ambiente('sala'); passi(ora()+.15,4,.6); },
    C2:()=>{ porta(); passi(ora()+.5,2,.55); },
    R1:()=>{ passi(ora()+.15,2,.55); },
    R2:()=>{ passi(ora()+.15,4,.6); },
    D: ()=>{ ambiente('scrivania'); },
  };
  function clip(nome){ if(!ok()) return; const f=CLIPSUONO[nome]; if(f) f(); }

  /* ---------- la conta banconote ogni tanto, sulla scrivania ---------- */
  function contaOgniTanto(attiva, puo){
    clearTimeout(tContare);
    if(!attiva||!ok()) return;
    const giro=()=>{
      if (puo && !puo()) return;          /* se non siamo piu' alla scrivania, silenzio */
      contaSoldi(.5,1.1+Math.random()*.8);
      tContare=setTimeout(giro, 22000+Math.random()*26000);
    };
    tContare=setTimeout(giro, 6000+Math.random()*9000);
  }

  function interruttore(){
    acceso=!acceso;
    try{ localStorage.setItem('fgma-audio', acceso?'si':'no'); }catch(e){}
    if (master){ const t=ora(); master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(Math.max(.0001,master.gain.value),t);
      master.gain.exponentialRampToValueAtTime(acceso?1:.0001,t+.4); }
    return acceso;
  }
  return { avvia, acceso:()=>acceso, interruttore, campanello, porta, oggetto, indietro, girata,
           ambiente, musica, abbassaMusica, preparaBrano, clip, contaSoldi, contaOgniTanto,
           _ctx:()=>AC, _master:()=>master };
})();

function apri(id){
  if (stato!=='scrivania' && stato!=='sala') return;
  const da=stato; stato='transito';
  const senzaClip = ASSENTI.has(id);
  AUDIO.oggetto(id); AUDIO.contaOgniTanto(false); inquadra(centroX(id)); mostraScorri(false);
  if (!senzaClip){ strato(da,false); supVista(da,false); }

function trascina(fin, pista, passo){
  let y0=null, base=0, pos=0, max=0;
  const mis=()=>{ max=Math.max(0, pista.scrollHeight-fin.clientHeight); };
  const metti=(p,anim)=>{
    mis(); pos=Math.max(0,Math.min(max,p));
    pista.classList.toggle('libera',!anim);
    pista.style.transform=`translateY(${-pos}px)`;
    const asta=fin.querySelector('.asta b');
    if (asta){ const f=fin.clientHeight/Math.max(1,pista.scrollHeight);
      asta.style.height=Math.max(12,f*100)+'%'; asta.style.top=(max?pos/max*(100-Math.max(12,f*100)):0)+'%'; }
    fin.closest('.tab,.nov,.pcs')?.classList.add('toccata');
  };
  fin.addEventListener('wheel', e=>{ e.preventDefault(); metti(pos+e.deltaY, true); }, {passive:false});
  fin.addEventListener('pointerdown', e=>{
    if (e.target.closest('a,button')) return;
    y0=e.clientY; base=pos; fin.classList.add('tira');
    try{ fin.setPointerCapture(e.pointerId); }catch(err){}
  });
  fin.addEventListener('pointermove', e=>{ if(y0===null) return; metti(base-(e.clientY-y0), false); });
  const lascia=()=>{ if(y0===null) return; y0=null; fin.classList.remove('tira'); metti(pos,true); };
  fin.addEventListener('pointerup', lascia); fin.addEventListener('pointercancel', lascia);
  return {vai:d=>metti(pos+d*(passo||fin.clientHeight*0.6),true), inizio:()=>metti(0,false), mis};
}

      <div class="titolone">Come funziona</div>
      ${P.map((p,k)=>`<div class="passo"><div class="q">${String(k+1).padStart(2,'0')}</div>
        <div><h3>${p.t}</h3><p>${p.d}</p>${p.tag?`<span class="tag">${p.tag}</span>`:''}</div></div>`).join('')}
      <div class="chiusa">Un rapporto che cresce per gradi.</div>
    </div><div class="asta"><b></b></div></div>
    <div class="giu-ind">Scorri verso il basso ↓</div></div>`);
  const sc1=trascina($('.finestra',st), $('.pista',st));
  AVVIA['come-funziona']=()=>{ $('.tab',st).classList.remove('toccata'); setTimeout(sc1.inizio,30); };
  TASTI['come-funziona']=e=>{ if(e.key==='ArrowDown') sc1.vai(1); if(e.key==='ArrowUp') sc1.vai(-1); };

  /* ---- contatti: pannello sul leggio ---- */
  const C=T.contatti;
  const sc2=superficie('contatti',`<div class="card2"><div class="mazzo2">
    <div class="f2 av">
      <div class="lockup"><img class="ib" src="img/lk-ib.png" alt=""><i></i><img class="ma" src="img/lk-ma.png" alt=""></div>
      <div class="fil"></div>
      <dl>
        <dt>Referente</dt><dd>${C.referente}<br><span class="ruolo">${C.ruolo}</span></dd>
        <dt>Telefono</dt><dd><span class="numero">${C.telefono}</span><button class="copia">Copia</button></dd>
        <dt>Orari</dt><dd><span class="ore">${C.orari}</span></dd>
      </dl>
      <div class="chiusa"><span>FGMA</span><em></em><span>Investment &amp; Management</span></div>
    </div>
    <div class="f2 dt">
      <h3>Vuoi diventare cliente?</h3>
      <p>Scrivici su WhatsApp o chiamaci: ti rispondiamo di persona e fissiamo un primo colloquio, senza impegno.</p>
      <div class="sedi">${C.sedi.map(([n,z])=>`<div class="sede"><b>${n}</b><time data-z="${z}">--:--</time><small>ora locale</small></div>`).join('')}</div>
      <div class="azioni"><a class="wa" href="${C.wa}" target="_blank" rel="noopener">WhatsApp</a>
        <a class="tel" href="tel:${C.tel}">Chiama</a></div>
    </div>
  </div><div class="pie2" id="cc-et">Gira il biglietto ›</div></div>`);
  const carta=$('.card2',sc2);
  const giraCarta=()=>{ AUDIO.girata(); carta.classList.toggle('girato');
    $('#cc-et',sc2).textContent = carta.classList.contains('girato') ? '‹ Gira il biglietto' : 'Gira il biglietto ›'; };
  sc2.addEventListener('click', e=>{ if (e.target.closest('a,button')) return; giraCarta(); });
  AVVIA['contatti']=()=>{ carta.classList.remove('girato'); $('#cc-et',sc2).textContent='Gira il biglietto ›'; };
  TASTI['contatti']=e=>{ if(['ArrowLeft','ArrowRight',' ','Enter'].includes(e.key)) giraCarta(); };
  $('.copia',sc2).onclick=async e=>{
    const b=e.currentTarget;
    try{ await navigator.clipboard.writeText(C.telefono.replace(/\s/g,'')); b.textContent='Copiato'; }
    catch(err){ const r=document.createRange(); r.selectNodeContents($('.numero',sc2));
      const s2=getSelection(); s2.removeAllRanges(); s2.addRange(r); b.textContent='Selezionato'; }
    setTimeout(()=>b.textContent='Copia',1600);
  };
  const orologi=()=>{
    const f=z=>new Intl.DateTimeFormat('it-IT',{hour:'2-digit',minute:'2-digit',timeZone:z}).format(new Date());
    const o=$('.ora',st); if(o) o.textContent=f('Europe/Rome');
    $$('time',sc2).forEach(t=>t.textContent=f(t.dataset.z));
  };
  orologi(); setInterval(orologi,20000);

  /* ---- fogli sul mobile: le novità ---- */
  const sn=superficie('fogli', HNOVITA());
  let sc3=trascina($('.finestra',sn), $('.pista',sn));
  AVVIA['fogli']=()=>setTimeout(sc3.inizio,30);
  TASTI['fogli']=e=>{ if(e.key==='ArrowDown') sc3.vai(1); if(e.key==='ArrowUp') sc3.vai(-1); };

  /* ---- lavagna in vetro: gli investimenti ---- */
  const ss=superficie('novita', HINVESTIMENTI());

  /* ---- schermo a parete: i clienti che hai portato ---- */
  superficie('schermo', HCLIENTI());

  /* ---- targa sulla porta della sala ---- */
  const starga=superficie('targa', HTARGA(), 'piana');

  /* dopo l'accesso i tre contenuti si riscrivono con i dati veri */
  RIDISEGNA = ()=>{
    sn.innerHTML=HNOVITA(); sc3=trascina($('.finestra',sn), $('.pista',sn));
    AVVIA['fogli']=()=>setTimeout(sc3.inizio,30);
    TASTI['fogli']=e=>{ if(e.key==='ArrowDown') sc3.vai(1); if(e.key==='ArrowUp') sc3.vai(-1); };
    ss.innerHTML=HINVESTIMENTI();
    $('#s-schermo').innerHTML=HCLIENTI();
    starga.innerHTML=HTARGA();
    const AN2=ANTEPRIME();
    for (const k of ['novita','schermo','fogli']){
      const e=$('#s-ant-'+k); if (e) e.innerHTML=AN2[k];
    }
  };
  /* ---- vecchio blocco investimenti (ora in HINVESTIMENTI) ---- */
  /* ---- targa accanto alla porta dell'area clienti ---- */
  superficie('targa-clienti',`<div class="tgp"><div class="st">★</div>
    <div class="d"><b>Area clienti</b><small>accesso riservato</small></div></div>`,'piana');

  /* ---- anteprime sugli oggetti delle due viste ---- */
  const AN = ANTEPRIME();
  for (const k in AN) superficie('ant-'+k, AN[k], 'ant');

  /* ---- display del conta banconote ---- */
  const sd=superficie('display',`<div class="disp"><i>N.</i><b id="dsp">0000</b><i>pz</i></div>`,'piana');
  let n=0;
  setInterval(()=>{ if(!sd.classList.contains('on')) return;
    n=(n+Math.ceil(Math.random()*3))%2500; $('#dsp',sd).textContent=String(n).padStart(4,'0'); },180);
}

/* ====================== avvio ====================== */
$('#entra').onclick=()=>{
  AUDIO.avvia(); AUDIO.preparaBrano();
  $('#intro').classList.add('via'); stato='transito';
  play('A', vaiCitofono);
};
(()=>{ const a=$('#varco-portale'), u=window.PORTALE_URL;
  if (a && u){ a.href=u; a.hidden=false; } })();
(()=>{ const b=$('#t-audio'); if(!b) return;
  const segna=()=>b.classList.toggle('muto', !AUDIO.acceso());
  segna();
  b.onclick=e=>{ e.stopPropagation(); AUDIO.avvia(); AUDIO.interruttore(); segna(); };
})();
if (!COORD){ $('#err').style.display='block'; $('#err').textContent='Coordinate mancanti.'; }
else {
  creaVideo(); costruisciPunti(); costruisci(); adatta();
  addEventListener('resize', adatta);
  precarica();
}
</script>

</body>
</html>
